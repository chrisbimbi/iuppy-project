version: '3.8'

services:
  postgres:
    image: postgres:13
    platform: linux/arm64/v8
    container_name: iuppy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iuppy_admin
      POSTGRES_PASSWORD: "Iuppy#2025"
      POSTGRES_DB: iuppy_dev
    volumes:
      - iuppy_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:alpine
    container_name: iuppy_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - iuppy_redis_data:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/arm64/v8
    container_name: iuppy_api
    restart: unless-stopped
    env_file:
      - ./backend/.env.development
    environment:
      # Overrides for Docker internal networking
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      - postgres
      - redis
    command: npm run start:dev
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/usr/src/app
      - ./shared:/usr/src/shared
      - api_node_modules:/usr/src/app/node_modules
      # 👇 MONTA O JSON DENTRO DO CONTAINER EXATAMENTE NO PATH DA ENV
      - ./backend/creds/firebase-admin.json:/usr/src/app/creds/firebase-admin.json:ro

volumes:
  iuppy_postgres_data:
  api_node_modules:
  iuppy_redis_data:
