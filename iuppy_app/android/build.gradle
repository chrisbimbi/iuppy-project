// android/build.gradle (root)

buildscript {
  repositories {
    google()
    mavenCentral()
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
  }
}

rootProject.buildDir = "../build"

subprojects { project ->
  project.buildDir = "${rootProject.buildDir}/${project.name}"
  project.evaluationDependsOn(":app")
}

/**
 * ✅ Nivelamento global para Java/Kotlin 11
 *   - Corrige "Inconsistent JVM-target compatibility detected (... 11) vs (... 17)"
 * ✅ Patch do image_gallery_saver: remove package="..." do manifest (AGP 8+)
 */
// 1) Force versions using logic that handles already-evaluated projects
// 1) Force versions using cleaner plugins.withId hook
// 1) Force versions using cleaner plugins.withId hook
// 1) Force versions using cleaner plugins.withId hook
// 1) Force versions using cleaner plugins.withId hook
subprojects {
    project.plugins.withId("com.android.library") {
        def androidExt = project.extensions.findByType(com.android.build.gradle.LibraryExtension.class)
        if (androidExt != null) {
            
            // Inject namespace if missing (Crucial for AGP 8+) - APPLY TO ALL
            if (androidExt.namespace == null) {
                def ns = "com.iuppy.generated.${project.name.replaceAll('-', '_')}"
                println("⚙️ Injecting namespace '$ns' into ${project.name}")
                androidExt.namespace = ns
            }

            // Special handling: flutter_app_badger is legacy and cannot handle Java 11 + SDK 35 forced
            if (project.name != 'flutter_app_badger') {
                // Force SDK 35
                androidExt.compileSdkVersion 35
                
                // Standardize Java Version
                androidExt.compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_11
                    targetCompatibility = JavaVersion.VERSION_11
                }
            } else {
                 println("⚠️ Skipping SDK/Java forcing for legacy plugin: ${project.name}")
            }
        }
    }
    
    // Kotlin options (Skip for badger too if it had kotlin, simpler to just run for others)
    if (project.name != 'flutter_app_badger') {
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions { jvmTarget = "11" }
        }
    }
}

// 4) PATCH: remove package="..." do manifest do image_gallery_saver (AGP 8+)
gradle.projectsEvaluated {
  subprojects { sub ->
    if (sub.name == "image_gallery_saver" || sub.name == "flutter_app_badger") {
      sub.plugins.withId("com.android.library") {
        def mf = sub.file("src/main/AndroidManifest.xml")
        if (mf.exists()) {
          def txt = mf.getText("UTF-8")
          if (txt.contains('package="')) {
            println("⚙️ Patching ${sub.path} manifest: removing package attribute")
            def patched = txt.replaceFirst(/\s+package="[^"]*"/, "")
            mf.write(patched, "UTF-8")
          }
        }
      }
    }
  }
}

tasks.register("clean", Delete) {
  delete rootProject.buildDir
}